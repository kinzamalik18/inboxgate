# Render blueprint: the InboxGate app and an n8n instance with the workflow built in.
#
# Both read two environment groups you create once in the Render dashboard:
#   gemini    GEMINI_API_KEY
#   supabase  DATABASE_URL (no password in it), PGPASSWORD,
#             DB_POSTGRESDB_HOST, DB_POSTGRESDB_USER, DB_POSTGRESDB_PASSWORD
# The app keeps its tables in the public schema and n8n uses the "n8n" schema of
# the same database. The token that links them is generated here and shared, so
# nobody has to copy it.
#
# After the first deploy, set N8N_INBOUND_URL on the app to the n8n URL plus
# /webhook/inboxgate-inbound, and INBOXGATE_API_URL on n8n to the app's URL.
services:
  - type: web
    name: inboxgate
    runtime: docker
    rootDir: api
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: gemini
      - fromGroup: supabase
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_CHAT_MODEL
        value: gemini-3.5-flash-lite
      - key: WORKFLOW_TOKEN
        generateValue: true

  - type: web
    name: inboxgate-n8n
    runtime: docker
    rootDir: n8n
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    envVars:
      - fromGroup: supabase
      - key: INBOXGATE_TOKEN
        fromService:
          name: inboxgate
          type: web
          envVarKey: WORKFLOW_TOKEN
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: N8N_BLOCK_ENV_ACCESS_IN_NODE
        value: "false"
      - key: N8N_LISTEN_ADDRESS
        value: 0.0.0.0
      - key: N8N_DIAGNOSTICS_ENABLED
        value: "false"
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_SCHEMA
        value: n8n
      - key: DB_POSTGRESDB_DATABASE
        value: postgres
      - key: DB_POSTGRESDB_PORT
        value: "5432"
      - key: DB_POSTGRESDB_SSL_ENABLED
        value: "true"
      - key: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: GENERIC_TIMEZONE
        value: Europe/London
